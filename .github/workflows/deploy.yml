name: Deploy to VPS

# Secrets (update when migrating to Hostinger):
#   VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, DEPLOY_PATH
# See docs/HOSTINGER_VPS_MIGRATION.md

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-to-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, zip
          coverage: none

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            echo "📦 Installing NPM dependencies..."
            npm ci --silent
            npm run build
            echo "⚙️ Maintenance mode..."
            php artisan down --refresh=15 || true
            echo "🗃️ Running database migrations..."
            php artisan migrate --force
            echo "⚡ Optimizing..."
            php artisan optimize:clear
            php artisan optimize
            echo "🔗 Linking storage..."
            php artisan storage:link || true
            php artisan up
            echo "✅ Deployment completed successfully!"

